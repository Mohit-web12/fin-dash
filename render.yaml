services:
  - type: web
    name: fin-dash-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      # Update this to the frontend's actual onrender.com URL after first deploy.
      - key: CORS_ORIGINS
        value: https://fin-dash-web.onrender.com
      - key: SEED_USER_EMAIL
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false
      # ENGINE_BASE_URL is deliberately unset here. The trade lifecycle engine runs
      # locally and isn't reachable from Render, so Investments serves its own sample
      # book instead. Setting this to a localhost URL is what previously made the API
      # call itself and return 404 on that page.
    # Render's free plan has an ephemeral filesystem: the SQLite file at
    # /app/data/finance.db is wiped on every deploy and on periodic restarts.
    # Fine for a demo; uncomment this (and upgrade off the free plan) for
    # data that needs to survive:
    # disk:
    #   name: fin-dash-data
    #   mountPath: /app/data
    #   sizeGB: 1

  - type: web
    name: fin-dash-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The -s3o9 suffix is not a typo. The plain fin-dash-api.onrender.com
      # subdomain belongs to an unrelated account, so Render gave this service a
      # suffixed host; pointing here at the bare name reaches a stranger's API.
      # Vite bakes this in at build time, so changing it needs a rebuild, not a restart.
      - key: VITE_API_BASE_URL
        value: https://fin-dash-api-s3o9.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
